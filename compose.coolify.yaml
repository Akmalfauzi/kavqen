# PostgreSQL is managed separately by Coolify. Enable predefined network access.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    expose:
      - "6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: .
      target: ai-service
    restart: unless-stopped
    # Initialize shared storage without overwriting published workflows.
    command:
      - sh
      - -c
      - cp -rn /app/default-configs/. /app/configs/ && chown -R 1000:1000 /app/configs && exec uvicorn main:app --host 0.0.0.0 --port 8001
    environment:
      QDRANT_URL: http://qdrant:6333
      KNOWLEDGE_INTERNAL_TOKEN: ${KNOWLEDGE_INTERNAL_TOKEN:?Required}
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - workflow-configs:/app/configs
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    environment:
      PORT: "3003"
      DATABASE_URL: ${DATABASE_URL:?Required}
      JWT_SECRET: ${JWT_SECRET:?Required}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:?Required}
      ENCRYPTION_KEY: ${NEXT_PUBLIC_ENCRYPTION_KEY:?Required}
      GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_DRIVER: smtp
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Kavqen <noreply@kavqen.my.id>}
      KNOWLEDGE_INTERNAL_TOKEN: ${KNOWLEDGE_INTERNAL_TOKEN:?Required}
      AI_SERVICE_URL: http://ai-service:8001
      CLIENT_URL: ${CLIENT_URL:-https://kavqen.my.id}
      GATEWAY_URL: ${GATEWAY_URL:-https://api.kavqen.my.id}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://api.kavqen.my.id/api/v1/integrations/google/callback}
    volumes:
      - workflow-configs:/app/configs
    expose:
      - "3003"
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3003/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    build:
      context: .
      target: client
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://api.kavqen.my.id}
        NEXT_PUBLIC_ENCRYPTION_KEY: ${NEXT_PUBLIC_ENCRYPTION_KEY:?Required}
    restart: unless-stopped
    expose:
      - "3002"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3002').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  workflow-configs:
  qdrant-data:
